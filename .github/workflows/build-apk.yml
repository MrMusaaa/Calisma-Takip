name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MesaiTakip.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-APK
          path: MesaiTakip.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Mesai Takip v1.0.0 (Hazır APK)"
          body: |
            ### 📲 Kurulum Dosyası
            Aşağıdaki **`MesaiTakip.apk`** dosyasına tıklayarak doğrudan telefonunuza indirebilir ve kurabilirsiniz.
            
            - ⏱ Kilit ekranından anında Başlat / Bitir
            - 🔋 Sıfır arka plan pil tüketimi
            - 💰 Pazartesi - Pazar haftalık döngü & Salı Maaş Günü
            - 📊 İnteraktif haftalık mesai ve kazanç grafiği
          files: MesaiTakip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
