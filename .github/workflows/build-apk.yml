name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MesaiTakip.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MesaiTakip-APK
          path: MesaiTakip.apk
          retention-days: 30
          overwrite: true

      - name: Publish or Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Mesai Takip (En Güncel Sürüm)"
          make_latest: true
          body: |
            ### 📲 Güncel Kurulum Dosyası
            Her güncellemede otomatik olarak yeniden derlenen en güncel APK dosyasıdır.
            
            👉 **[MesaiTakip.apk](../../releases/latest/download/MesaiTakip.apk)** dosyasına dokunarak telefonunuza tek tıkla indirebilirsiniz.
            
            - ⏱ Redmi 12 ve tüm cihazlarda kilit ekranı kontrolü
            - 🔋 0% pil tüketimi (zaman damgası mimarisi)
            - 💰 Pazartesi - Pazar haftalık hesaplama & Salı Maaş Günü
            - 📊 Haftalık mesai ve hakediş grafiği
            - 📅 Tarih seçilebilir manuel mesai ekleme
          files: MesaiTakip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
